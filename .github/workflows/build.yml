name: Windows app

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write  # attach the zip to a GitHub Release on version tags

jobs:
  build:
    runs-on: windows-latest
    # A windowed exe that fails at start shows a dialog nobody can dismiss here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[app]" "pyinstaller>=6.10"
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name aafconform
          --icon src/aafconform/app/icon.ico
          --add-data "src/aafconform/app/ui;aafconform/app/ui"
          --collect-submodules aaf2
          --collect-submodules aafconform
          packaging/launcher.py
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aafconform\aafconform.exe -ArgumentList '--self-test','--log','selftest.log' -Wait -PassThru -NoNewWindow
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Open the window, timed
        # The real window on the runner, closed again once the page is showing
        # and the drop zones are wired. Twice: the first launch also creates
        # the browser profile, which is most of its time.
        shell: pwsh
        timeout-minutes: 3
        run: |
          foreach ($n in 1, 2) {
            $p = Start-Process -FilePath dist\aafconform\aafconform.exe -ArgumentList '--launch-test','--log',"launch$n.log" -Wait -PassThru
            "launch ${n}: exit code $($p.ExitCode), timings from the double-click:"
            Get-Content "launch$n.log"
            if (-not (Select-String -Path "launch$n.log" -Pattern '^\s*[\d.]+s ready$' -Quiet)) { throw "launch ${n}: the window never got ready" }
          }
      - name: Mark files as downloaded, like unzipping a download does
        # Explorer tags files extracted from a downloaded zip with the internet
        # zone, and .NET then refuses the app's own DLLs. The app clears the
        # tags from its own folder at start; this proves it still launches.
        shell: pwsh
        run: |
          Get-ChildItem dist\aafconform -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
      - name: Self-test again as a downloaded copy
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aafconform\aafconform.exe -ArgumentList '--self-test','--log','selftest-downloaded.log' -Wait -PassThru -NoNewWindow
          Get-Content selftest-downloaded.log
          if ($p.ExitCode -ne 0) { throw "self-test as a downloaded copy failed with exit code $($p.ExitCode)" }
      - name: Add licence
        shell: pwsh
        run: Copy-Item LICENSE dist\aafconform\LICENSE.txt
      # GitHub zips artifacts on download, so upload the folder itself:
      # downloading gives one zip with aafconform.exe and its files inside.
      - uses: actions/upload-artifact@v7
        with:
          name: aafconform-windows
          path: dist/aafconform
          retention-days: 30
      # Release assets are served as they are, so releases get our own zip.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\aafconform -DestinationPath aafconform-windows.zip
          gh release create "${{ github.ref_name }}" aafconform-windows.zip --title "aafconform ${{ github.ref_name }}" --generate-notes
