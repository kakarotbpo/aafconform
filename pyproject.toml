[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aafconform"
version = "0.1.0"
description = "Rebuild an Avid cut against the proper multigroup from a reference sequence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyaaf2>=1.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
app = ["pywebview>=5.3"]

[project.scripts]
aafconform = "aafconform.cli:main"

[project.gui-scripts]
aafconform-app = "aafconform.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aafconform.app" = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
